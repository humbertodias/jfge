name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - libgdx
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/native
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'

      - name: Download game assets
        run: make -f makefile-assets get_assets

      - name: Build web games
        run: |
          gradle :wrapper --configure-on-demand
          mkdir -p site
          cp html/site/index.html site/
          touch site/.nojekyll

          build_game() {
            local dir="$1"
            local mainClass="$2"
            ./gradlew :html:gdx_teavm_web_js_build \
              -PwebMainClass="$mainClass" \
              --configure-on-demand \
              --no-daemon
            mkdir -p "site/$dir"
            cp -r html/build/dist/js/webapp/* "site/$dir/"
          }

          build_game mk2 org.jfge.html.Mk2HtmlLauncher
          build_game sf2 org.jfge.html.Sf2HtmlLauncher
          build_game sfvsmk2 org.jfge.html.SfVsMk2HtmlLauncher

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
