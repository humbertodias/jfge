plugins {
    id 'java'
    id 'com.github.xpenatan.gdx-teavm' version "${gdxTeaVMVersion}"
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
}

def webMainClass = findProperty('webMainClass') ?: 'org.jfge.html.Mk2HtmlLauncher'

gdxTeaVM {
    assets.from(
        project(':engine').file('config'),
        project(':ext').file('config'),
        project(':mk2').file('config'),
        project(':mk2').file('assets'),
        project(':sf2').file('config'),
        project(':sf2').file('assets'),
        project(':sfvsmk2').file('config'),
        project(':sfvsmk2').file('assets')
    )

    reflection.add('org.jfge.**')
    reflection.add('dagger.**')

    js {
        mainClass.set(webMainClass)
    }
}

tasks.register('runMk2') {
    group = 'web'
    description = 'Run Mortal Kombat 2 in the browser'
    dependsOn 'gdx_teavm_web_js_run'
}

tasks.register('runSf2') {
    group = 'web'
    description = 'Run Street Fighter 2 in the browser'
    dependsOn 'gdx_teavm_web_js_run'
}

tasks.register('runSfVsMk2') {
    group = 'web'
    description = 'Run Street Fighter vs Mortal Kombat 2 in the browser'
    dependsOn 'gdx_teavm_web_js_run'
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(tasks.named('runSf2').get())) {
        gdxTeaVM.js.mainClass.set('org.jfge.html.Sf2HtmlLauncher')
    } else if (graph.hasTask(tasks.named('runSfVsMk2').get())) {
        gdxTeaVM.js.mainClass.set('org.jfge.html.SfVsMk2HtmlLauncher')
    } else if (graph.hasTask(tasks.named('runMk2').get())) {
        gdxTeaVM.js.mainClass.set('org.jfge.html.Mk2HtmlLauncher')
    }
}
