pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url = uri('https://teavm.org/maven/repository/') }
    }
}

rootProject.name = 'jfge'

include 'engine'
include 'ext'
include 'core'
include 'desktop'
include 'html'
include 'j2se'
include 'mk2'
include 'sf2'
include 'sfvsmk2'

def androidLocalProperties = file('android/local.properties')
def androidSdkHome = System.getenv('ANDROID_HOME')

if (androidLocalProperties.exists() || androidSdkHome) {
    include 'android'
}
